[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[program:xvfb]
command=Xvfb :1 -screen 0 1920x1080x24
autorestart=true
priority=10

[program:xfce4]
command=bash -c "sleep 2 && DISPLAY=:1 dbus-launch --exit-with-session startxfce4"
user=pazi
environment=HOME="/home/pazi",DISPLAY=":1"
autorestart=true
priority=20

[program:chromium]
command=bash -c "sleep 5 && chromium --no-sandbox --no-first-run --no-default-browser-check --disable-infobars --display=:1"
user=pazi
environment=HOME="/home/pazi",DISPLAY=":1"
autorestart=false
priority=25

[program:x11vnc]
command=bash -c "sleep 3 && x11vnc -display :1 -nopw -forever -shared -rfbport 5901 -localhost"
autorestart=true
priority=30

[program:websockify]
command=bash -c "sleep 4 && websockify --web /usr/share/novnc 6080 localhost:5901"
autorestart=true
priority=40

[program:agent]
command=bash -c "sleep 8 && exec node /app/openclaw.mjs gateway --allow-unconfigured --bind lan"
user=pazi
environment=HOME="/home/pazi",DISPLAY=":1",NODE_ENV="production"
autorestart=true
priority=50
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
