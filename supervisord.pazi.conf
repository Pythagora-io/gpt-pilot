[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[program:xvfb]
command=Xvfb :1 -screen 0 1920x1080x24
autorestart=true
priority=10

[program:xfce4]
command=bash -c "sleep 2 && DISPLAY=:1 dbus-launch --exit-with-session startxfce4"
user=pazi
environment=HOME="/home/pazi",DISPLAY=":1"
autorestart=true
priority=20

[program:chromium]
command=bash -c "sleep 5 && chromium --no-sandbox --no-first-run --no-default-browser-check --disable-infobars --display=:1"
user=pazi
environment=HOME="/home/pazi",DISPLAY=":1"
autorestart=false
priority=25

[program:selkies]
command=bash -c "sleep 3 && /opt/selkies/selkies-gstreamer/selkies-gstreamer-run --addr=0.0.0.0 --port=8080 --enable_https=false --encoder=x264enc --enable_resize=false --enable_basic_auth=false"
environment=DISPLAY=":1",XDG_RUNTIME_DIR="/tmp",PIPEWIRE_LATENCY="128/48000",PULSE_RUNTIME_PATH="/tmp/pulse",PULSE_SERVER="unix:/tmp/pulse/native"
autorestart=true
priority=30

[program:agent]
command=bash -c "sleep 8 && exec node /app/openclaw.mjs gateway --allow-unconfigured --bind lan"
user=pazi
environment=HOME="/home/pazi",DISPLAY=":1",NODE_ENV="production"
autorestart=true
priority=50
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
