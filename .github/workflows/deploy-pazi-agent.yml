name: Deploy Pazi Agent

on:
  push:
    branches: [main, staging]

  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy to"
        required: true
        type: choice
        options:
          - staging
          - production
        default: staging
      branch:
        description: "Branch to deploy"
        required: true
        type: string
        default: staging

permissions:
  contents: write

env:
  AWS_REGION: us-east-1

jobs:
  version-and-publish:
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.get_version.outputs.VERSION }}
      version_tag: ${{ steps.version_tag.outputs.VERSION_TAG }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}
          fetch-depth: 0

      - name: Read version from package.json
        id: get_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "Version: v${VERSION}"
          echo "VERSION=v${VERSION}" >> $GITHUB_OUTPUT

      - name: Determine environment
        id: env
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ENVIRONMENT="${{ github.event.inputs.environment }}"
          elif [[ "${{ github.ref_name }}" == "main" ]]; then
            ENVIRONMENT="production"
          else
            ENVIRONMENT="staging"
          fi

          if [ "$ENVIRONMENT" = "production" ]; then
            echo "environment=production" >> $GITHUB_OUTPUT
            echo "suffix=" >> $GITHUB_OUTPUT
          else
            echo "environment=staging" >> $GITHUB_OUTPUT
            echo "suffix=-staging" >> $GITHUB_OUTPUT
          fi

      - name: Compute version tag
        id: version_tag
        run: |
          VERSION_TAG="${{ steps.get_version.outputs.VERSION }}${{ steps.env.outputs.suffix }}"
          echo "VERSION_TAG=$VERSION_TAG" >> $GITHUB_OUTPUT

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload latest version to S3
        run: |
          if [ "${{ steps.env.outputs.environment }}" = "production" ]; then
            S3_KEY="latest.txt"
          else
            S3_KEY="latest-staging.txt"
          fi
          echo "${{ steps.version_tag.outputs.VERSION_TAG }}" > "$S3_KEY"
          aws s3 cp "$S3_KEY" "s3://assets.pazi.ai/cloud/$S3_KEY"

      - name: Deployment Summary
        if: success()
        run: |
          echo "### Version Published! :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ steps.get_version.outputs.VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ steps.env.outputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "**S3 Tag:** ${{ steps.version_tag.outputs.VERSION_TAG }}" >> $GITHUB_STEP_SUMMARY

      - name: Extract PR info
        id: pr_info
        if: always()
        run: |
          # Extract PR number and title from merge commit message
          COMMIT_MSG=$(git log -1 --pretty=%s)
          PR_NUM=$(echo "$COMMIT_MSG" | grep -oP '#\d+' | head -1 | tr -d '#')
          if [ -n "$PR_NUM" ]; then
            echo "pr_link=<https://github.com/${{ github.repository }}/pull/${PR_NUM}|#${PR_NUM}>" >> $GITHUB_OUTPUT
            echo "pr_title=${COMMIT_MSG}" >> $GITHUB_OUTPUT
          else
            echo "pr_link=N/A (manual push)" >> $GITHUB_OUTPUT
            echo "pr_title=${COMMIT_MSG}" >> $GITHUB_OUTPUT
          fi

      - name: Notify Slack - Success
        if: success()
        uses: slackapi/slack-github-action@v2.1.0
        with:
          webhook: ${{ secrets.SLACK_DEPLOY_WEBHOOK }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": ":rocket: *Agent* published to *${{ steps.env.outputs.environment }}*\n*Version:* ${{ steps.version_tag.outputs.VERSION_TAG }}\n*PR:* ${{ steps.pr_info.outputs.pr_link }}\n*Commit:* <https://github.com/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>\n*Triggered by:* ${{ github.actor }}\n*Run:* <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|View logs>"
            }

      - name: Notify Slack - Failure
        if: failure()
        uses: slackapi/slack-github-action@v2.1.0
        with:
          webhook: ${{ secrets.SLACK_DEPLOY_WEBHOOK }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": ":x: *Agent* publish to *${{ steps.env.outputs.environment }}* FAILED\n*Commit:* <https://github.com/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>\n*Triggered by:* ${{ github.actor }}\n*Run:* <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|View logs>"
            }

  push-version-tag:
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    needs: version-and-publish

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Tag and bump version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          RELEASE_TAG="${{ needs.version-and-publish.outputs.version }}"
          if git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null; then
            echo "Tag ${RELEASE_TAG} already exists on origin; skipping tag creation."
          else
            git tag "${RELEASE_TAG}"
            git push origin "${RELEASE_TAG}"
          fi

          CURRENT=$(node -p "require('./package.json').version")
          # Version format: UPSTREAM-PAZI_PATCH (e.g. 2026.3.13-2)
          # Bump only the prerelease segment (pazi patch number)
          BASE="${CURRENT%%-*}"
          PAZI_PATCH="${CURRENT##*-}"
          if [ "$PAZI_PATCH" = "$CURRENT" ]; then PAZI_PATCH=0; fi
          NEXT="${BASE}-$((PAZI_PATCH + 1))"
          node -e "const pkg=require('./package.json'); pkg.version='${NEXT}'; require('fs').writeFileSync('package.json', JSON.stringify(pkg, null, '\t') + '\n')"

          # Sync pazi extension version to match root (upstream extensions keep their own versions)
          node -e "const fs=require('fs'),p='extensions/pazi/package.json',pkg=JSON.parse(fs.readFileSync(p,'utf8'));pkg.version='${NEXT}';fs.writeFileSync(p,JSON.stringify(pkg,null,2)+'\n')"

          git add package.json extensions/pazi/package.json
          git commit -m "chore: release ${NEXT} [skip ci]"
          git push origin HEAD:${{ github.ref_name }}
