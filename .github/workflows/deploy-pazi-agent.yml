name: Deploy Pazi Agent

on:
  push:
    branches: [main, staging]

  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        type: choice
        options:
          - staging
          - production
        default: staging
      branch:
        description: 'Branch to deploy'
        required: true
        type: string
        default: staging

permissions:
  contents: write
  packages: write

env:
  AWS_REGION: us-east-1
  GHCR_IMAGE: ghcr.io/pythagora-io/pazi-agent

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.build-image.outputs.image_tag }}
      version: ${{ steps.get_version.outputs.VERSION }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}
          fetch-depth: 0

      - name: Read version from package.json
        id: get_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "Version: v${VERSION}"
          echo "VERSION=v${VERSION}" >> $GITHUB_OUTPUT

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Determine environment
        id: env
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ENVIRONMENT="${{ github.event.inputs.environment }}"
          elif [[ "${{ github.ref_name }}" == "main" ]]; then
            ENVIRONMENT="production"
          else
            ENVIRONMENT="staging"
          fi

          if [ "$ENVIRONMENT" = "production" ]; then
            echo "environment=production" >> $GITHUB_OUTPUT
            echo "suffix=" >> $GITHUB_OUTPUT
          else
            echo "environment=staging" >> $GITHUB_OUTPUT
            echo "suffix=-staging" >> $GITHUB_OUTPUT
          fi

      - name: Build, tag, and push image to GHCR
        id: build-image
        env:
          IMAGE_TAG: ${{ steps.get_version.outputs.VERSION }}${{ steps.env.outputs.suffix }}
          LATEST_TAG: latest${{ steps.env.outputs.suffix }}
        run: |
          docker build -f Dockerfile.pazi -t $GHCR_IMAGE:$IMAGE_TAG .
          docker tag $GHCR_IMAGE:$IMAGE_TAG $GHCR_IMAGE:$LATEST_TAG

          docker push $GHCR_IMAGE:$IMAGE_TAG
          docker push $GHCR_IMAGE:$LATEST_TAG

          echo "image=$GHCR_IMAGE:$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload latest version to S3
        env:
          IMAGE_TAG: ${{ steps.build-image.outputs.image_tag }}
        run: |
          if [ "${{ steps.env.outputs.environment }}" = "production" ]; then
            S3_KEY="latest.txt"
          else
            S3_KEY="latest-staging.txt"
          fi
          echo "$IMAGE_TAG" > "$S3_KEY"
          aws s3 cp "$S3_KEY" "s3://assets.pazi.ai/cloud/$S3_KEY"

      - name: Deployment Summary
        if: success()
        run: |
          echo "### Build and Push Successful! :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** ${{ steps.build-image.outputs.image }}" >> $GITHUB_STEP_SUMMARY
          echo "**Registry:** GHCR (${{ env.GHCR_IMAGE }})" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ steps.get_version.outputs.VERSION }}" >> $GITHUB_STEP_SUMMARY

  push-version-tag:
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Tag and bump version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          RELEASE_TAG="${{ needs.build-and-push.outputs.version }}"
          if git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null; then
            echo "Tag ${RELEASE_TAG} already exists on origin; skipping tag creation."
          else
            git tag "${RELEASE_TAG}"
            git push origin "${RELEASE_TAG}"
          fi

          CURRENT=$(node -p "require('./package.json').version")
          # Version format: UPSTREAM.PAZI_PATCH (e.g. 2026.3.11.9)
          # Bump only the 4th segment (pazi patch number)
          IFS='.' read -r MAJOR MINOR UPSTREAM_PATCH PAZI_PATCH <<< "$CURRENT"
          NEXT="${MAJOR}.${MINOR}.${UPSTREAM_PATCH}.$((PAZI_PATCH + 1))"
          node -e "const pkg=require('./package.json'); pkg.version='${NEXT}'; require('fs').writeFileSync('package.json', JSON.stringify(pkg, null, '\t') + '\n')"

          # Sync pazi extension version to match root (upstream extensions keep their own versions)
          node -e "const fs=require('fs'),p='extensions/pazi/package.json',pkg=JSON.parse(fs.readFileSync(p,'utf8'));pkg.version='${NEXT}';fs.writeFileSync(p,JSON.stringify(pkg,null,2)+'\n')"

          git add package.json extensions/pazi/package.json
          git commit -m "chore: release ${NEXT} [skip ci]"
          git push origin HEAD:${{ github.ref_name }}
