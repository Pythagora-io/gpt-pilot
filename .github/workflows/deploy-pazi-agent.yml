name: Deploy Pazi Agent

on:
    push:
        branches: [main, staging]

    workflow_dispatch:

permissions:
    contents: write
    packages: write

env:
    AWS_REGION: us-east-1
    GHCR_IMAGE: ghcr.io/pythagora-io/pazi-agent

jobs:
    build-and-push:
        runs-on: ubuntu-latest

        outputs:
            image_tag: ${{ steps.build-image.outputs.image_tag }}
            version: ${{ steps.get_version.outputs.VERSION }}

        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Read version from package.json
              id: get_version
              run: |
                  VERSION=$(node -p "require('./package.json').version")
                  echo "Version: v${VERSION}"
                  echo "VERSION=v${VERSION}" >> $GITHUB_OUTPUT

            - name: Login to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build, tag, and push image to GHCR
              id: build-image
              env:
                  IMAGE_TAG: ${{ steps.get_version.outputs.VERSION }}
              run: |
                  docker build -f Dockerfile.pazi -t $GHCR_IMAGE:$IMAGE_TAG .
                  docker tag $GHCR_IMAGE:$IMAGE_TAG $GHCR_IMAGE:latest

                  docker push $GHCR_IMAGE:$IMAGE_TAG
                  docker push $GHCR_IMAGE:latest

                  echo "image=$GHCR_IMAGE:$IMAGE_TAG" >> $GITHUB_OUTPUT
                  echo "image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  aws-region: ${{ env.AWS_REGION }}

            - name: Upload latest version to S3
              run: |
                  if [[ "${{ github.ref_name }}" == "main" ]]; then
                    S3_KEY="latest.txt"
                  else
                    S3_KEY="latest-staging.txt"
                  fi
                  echo "${{ steps.get_version.outputs.VERSION }}" > "$S3_KEY"
                  aws s3 cp "$S3_KEY" "s3://assets.pazi.ai/cloud/$S3_KEY"

            - name: Deployment Summary
              if: success()
              run: |
                  echo "### Build and Push Successful! :rocket:" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "**Image:** ${{ steps.build-image.outputs.image }}" >> $GITHUB_STEP_SUMMARY
                  echo "**Registry:** GHCR (${{ env.GHCR_IMAGE }})" >> $GITHUB_STEP_SUMMARY
                  echo "**Version:** ${{ steps.get_version.outputs.VERSION }}" >> $GITHUB_STEP_SUMMARY

    push-version-tag:
        if: github.ref_name == 'main'
        runs-on: ubuntu-latest
        needs: build-and-push

        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  token: ${{ secrets.GH_PAT }}
                  fetch-depth: 0

            - name: Tag and bump version
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"

                  git tag ${{ needs.build-and-push.outputs.version }}
                  git push origin ${{ needs.build-and-push.outputs.version }}

                  CURRENT=$(node -p "require('./package.json').version")
                  IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
                  NEXT="${MAJOR}.${MINOR}.$((PATCH + 1))"
                  node -e "const pkg=require('./package.json'); pkg.version='${NEXT}'; require('fs').writeFileSync('package.json', JSON.stringify(pkg, null, '\t') + '\n')"

                  git add package.json
                  git commit -m "chore: release ${NEXT} [skip ci]"
                  git push origin HEAD:${{ github.ref_name }}
